; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-a4988

; shared ESP32 settings, one env per hardware build below
[esp32_base]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; unit tests rely on arduino_mock, run them with: pio test -e native
test_ignore = test_native

; bipolar steppers via A4988 drivers (constants_a4988.h)
[env:esp32-a4988]
extends = esp32_base
build_flags = -DMOTOR_DRIVER_A4988

; unipolar steppers via ULN2803 darlington array (constants_uln2803.h)
[env:esp32-uln2803]
extends = esp32_base
build_flags = -DMOTOR_DRIVER_ULN2803

[env:native]
platform = native
build_flags = -DUNIT_TEST